name: GPTGuard
options:
  bundleIdPrefix: com.gptguard
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: "5.1.3"

targets:
  GPTGuard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: AppSources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gptguard.ios
        PRODUCT_NAME: GPTGuard
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/GPTGuard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
    dependencies:
      - target: PacketTunnel
        embed: true
      - package: Yams
      - framework: Frameworks/Corebridge.xcframework
        embed: false
      - sdk: WebKit.framework
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: UserNotifications.framework
      - sdk: UIKit.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
      - sdk: Foundation.framework
      - sdk: libresolv.tbd
      - sdk: libz.tbd

  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: TunnelSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gptguard.ios.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TunnelResources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TunnelResources/PacketTunnel.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
    dependencies:
      - framework: Frameworks/Corebridge.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: UserNotifications.framework
      - sdk: UIKit.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
      - sdk: Foundation.framework
      - sdk: libresolv.tbd
      - sdk: libz.tbd
